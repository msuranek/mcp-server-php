name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, pdo, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: composer validate --strict
      - run: composer test
      - run: composer analyse

  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose build server
      - run: docker compose up -d db
      - run: docker compose run --rm --no-TTY server < tests/fixtures/mcp-session.jsonl > var/mcp-session-output.jsonl
      - run: grep -q '"name":"query_records"' var/mcp-session-output.jsonl
      - run: grep -q '"company_name":"Northwind Labs"' var/mcp-session-output.jsonl
      - if: always()
        run: docker compose down --volumes
